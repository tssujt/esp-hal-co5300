version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/tests/host"
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
