[package]
name = "esp-hal-co5300"
version = "0.1.0"
edition = "2024"
description = "A no_std CO5300 AMOLED QSPI driver built on esp-hal (ESP32-S3)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tssujt/esp-hal-co5300"
rust-version = "1.88"
keywords = ["co5300", "amoled", "esp32s3", "esp-hal", "display"]
categories = ["embedded", "no-std", "hardware-support"]
include = ["/src", "/examples", "/README.md", "/LICENSE-*"]

[features]
default = []
embedded-graphics = ["dep:embedded-graphics"]

[dependencies]
esp-hal = { version = "~1.2", features = ["esp32s3", "unstable"] }
embedded-graphics = { version = "0.8.2", optional = true, default-features = false }

[dev-dependencies]
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }

[[example]]
name = "waveshare"
required-features = ["embedded-graphics"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[[example]]
name = "hwtest"
required-features = ["embedded-graphics"]
